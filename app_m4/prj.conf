# Local Cortex-M4 motor controller: no network. IPC is diagnostic-only in phase 10.1.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
CONFIG_MBOX=y

# The motor loop runs in the main thread every 10 ms.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_THREAD_NAME=y

# The M4 board target has no console routed to ST-LINK by default.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

CONFIG_ASSERT=y
